<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strona Główna</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #001a4d 0%, #003d99 50%, #001a4d 100%);
            font-family: 'Arial', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            text-align: center;
            padding: 40px 20px;
            color: #ffffff;
        }

        header h1 {
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(30, 40, 80, 0.9);
            border: 1px solid rgba(100, 150, 255, 0.3);
            border-radius: 10px;
            padding: 60px 40px;
            text-align: center;
            max-width: 500px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .container p {
            color: #ffffff;
            font-size: 24px;
            margin-bottom: 40px;
            font-weight: bold;
        }

        .btn {
            display: inline-block;
            background: linear-gradient(135deg, #0066ff 0%, #0052cc 100%);
            color: #ffffff;
            padding: 15px 40px;
            text-decoration: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 102, 255, 0.4);
            margin: 10px 0 0 0;
        }

        .btn:hover {
            background: linear-gradient(135deg, #0052cc 0%, #003d99 100%);
            box-shadow: 0 6px 20px rgba(0, 102, 255, 0.6);
            transform: translateY(-2px);
        }

        footer {
            text-align: center;
            padding: 20px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
        }
    </style>
</head>
<body>
    <header>
        <h1>STRONA GŁÓWNA MAXMIL4N.GITHUB.IO</h1>
    </header>

    <main>
        <div class="container">
            <p><b>↓</b> Zaglądnij na te strony <b>↓</b></p>
            <a href="https://maxmil4n.github.io/archiwum_lekcji" class="btn">ARCHIWUM LEKCJI</a>
        </div>
    </main>

    <footer>
        <p>Dzięki za odwiedzenie &lt;3</p>
    </footer>
</body>
</html>
